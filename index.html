<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doubt2Meme — AI Doubt-to-Meme Translator</title>
<style>
  :root{
    --bg:#0A0A0A; --card:#161010; --card2:#1E1717; --border:#2A2222;
    --red:#D91E27; --red-dim:#5c0f14; --white:#FFFFFF; --grey:#B8B0B0; --grey2:#7A7070;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Calibri,Roboto,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:960px; margin:0 auto; padding:36px 20px 80px;}
  header{text-align:center; margin-bottom:34px; position:relative;}
  .logo-badge{
    display:inline-flex; align-items:center; gap:10px; background:var(--card2);
    border:1px solid var(--border); padding:6px 16px; border-radius:999px;
    font-size:12px; letter-spacing:2px; color:var(--red); font-weight:700; margin-bottom:18px;
  }
  h1{font-size:44px; font-weight:800; letter-spacing:-0.5px;}
